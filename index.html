<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessed Chain of Authority</title>
<style>
  :root {
    --bg: #0b120d;
    --green: #123524;
    --green-light: #1c4a33;
    --gold: #d4af37;
    --gold-light: #f1d98b;
    --text: #eae6da;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(160,110,45,0.13), transparent 55%),
      repeating-linear-gradient(45deg, rgba(212,175,55,0.045) 0px, rgba(212,175,55,0.045) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(-45deg, rgba(212,175,55,0.045) 0px, rgba(212,175,55,0.045) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(212,175,55,0.025) 0px, rgba(212,175,55,0.025) 1px, transparent 1px, transparent 42px);
    background-attachment: fixed;
  }

  header {
    padding: 40px 20px 20px 20px;
  }

  h1 {
    color: var(--gold-light);
    font-size: 1.8rem;
    margin: 0 0 8px 0;
    letter-spacing: 1px;
  }

  .subtitle {
    color: #c9c2a8;
    font-size: 1rem;
    font-style: italic;
    margin: 0;
  }

  .chain {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px 60px 15px;
  }

  .connector {
    width: 3px;
    height: 30px;
    background: linear-gradient(to bottom, var(--gold), var(--green-light));
  }

  .card {
    width: 100%;
    max-width: 480px;
    border-radius: 14px;
    padding: 18px 20px;
    cursor: pointer;
    border: 1px solid var(--gold);
    transition: transform 0.15s ease;
  }

  .card:active {
    transform: scale(0.98);
  }

  .card-prophet {
    background: linear-gradient(145deg, #1a1405, #2b2108);
    border: 2px solid var(--gold);
    padding: 28px 20px;
    box-shadow: 0 0 18px rgba(212,175,55,0.25);
    cursor: pointer;
  }

  .card-prophet .name {
    color: var(--gold-light);
    font-size: 1.4rem;
    font-weight: bold;
  }

  .card-shaykh {
    background: linear-gradient(145deg, var(--green), var(--green-light));
    border: 1px solid #3a5c47;
  }

  .card-shaykh .name {
    color: var(--text);
    font-size: 1.05rem;
    line-height: 1.4;
  }

  .card-final {
    background: linear-gradient(145deg, #1a1405, #2b2108);
    border: 2px solid var(--gold);
    padding: 24px 20px;
    box-shadow: 0 0 14px rgba(212,175,55,0.2);
  }

  .card-final .name {
    color: var(--gold-light);
    font-size: 1.15rem;
    font-weight: bold;
    line-height: 1.4;
  }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .overlay.active {
    display: flex;
  }

  .modal {
    background: #10190f;
    border: 1px solid var(--gold);
    border-radius: 14px;
    max-width: 500px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 30px 24px;
    position: relative;
    text-align: left;
  }

  .close-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    color: var(--gold-light);
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
    padding: 6px 10px;
  }

  .modal-number {
    color: var(--gold);
    font-size: 0.95rem;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .modal-name {
    color: var(--gold-light);
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .modal-dates {
    font-size: 1rem;
    margin-bottom: 6px;
    color: var(--text);
  }

  .modal-heading {
    color: var(--gold);
    font-size: 1.1rem;
    margin-top: 20px;
    margin-bottom: 8px;
    border-top: 1px solid #2a3d31;
    padding-top: 16px;
  }

  .modal-bio {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <h1>Blessed Chain of Authority</h1>

  /* ============================================================

  const chain = document.getElementById('chain');

  // The Prophet's info, used when the top card is clicked (no number)

    passedAway: "ToBeAdded",
    biography: "ToBeAdded"

  // Prophet card (starting point) - clickable
  const prophetCard = document.createElement('div');
  prophetCard.className = 'card card-prophet';
  prophetCard.innerHTML = '<div class="name">' + prophet.name + '</div>';
  prophetCard.addEventListener('click', () => openModal(prophet));
  chain.appendChild(prophetCard);

  shaykhs.forEach((s, index) => {
    // connector line
    const connector = document.createElement('div');
    connector.className = 'connector';
    chain.appendChild(connector);

    const card = document.createElement('div');
    const isLast = s.number === 38;
    card.className = 'card ' + (isLast ? 'card-final' : 'card-shaykh');
    card.innerHTML = '<div class="name">' + s.name + '</div>';

    card.addEventListener('click', () => openModal(s));
    chain.appendChild(card);
  });

  // Modal logic
  const overlay = document.getElementById('overlay');
  const modalNumber = document.getElementById('modalNumber');
  const modalName = document.getElementById('modalName');
  const modalBorn = document.getElementById('modalBorn');
  const modalPassed = document.getElementById('modalPassed');
  const modalBio = document.getElementById('modalBio');
  const closeBtn = document.getElementById('closeBtn');

  function openModal(s) {
    if (s.number === null || s.number === undefined) {
      modalNumber.textContent = '';
      modalNumber.style.display = 'none';
    } else {
      modalNumber.textContent = 'Shaykh #' + s.number;
      modalNumber.style.display = 'block';
    }
    modalName.textContent = s.name;
    modalBorn.textContent = 'Born: ' + s.born;
    modalPassed.textContent = 'Passed Away: ' + s.passedAway;
    modalBio.textContent = s.biography;
    overlay.classList.add('active');
  }

  function closeModal() {
    overlay.classList.remove('active');
  }

  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
</script>

</body>
</html>
