<title>Blessed Chain of Authority</title>

<style>
  :root {
    --bg: #17120c;
    --green: #123524;
    --green-light: #1c4a33;
    --gold: #d4af37;
    --gold-light: #f1d98b;
    --text: #eae6da;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    background-color: var(--bg);

    background-image:
      radial-gradient(
        circle at 50% -5%,
        rgba(218,155,72,0.20),
        transparent 52%
      ),
      radial-gradient(
        circle at 15% 85%,
        rgba(143,92,39,0.12),
        transparent 42%
      ),
      repeating-linear-gradient(
        45deg,
        rgba(212,175,55,0.035) 0px,
        rgba(212,175,55,0.035) 1px,
        transparent 1px,
        transparent 46px
      ),
      repeating-linear-gradient(
        -45deg,
        rgba(212,175,55,0.028) 0px,
        rgba(212,175,55,0.028) 1px,
        transparent 1px,
        transparent 46px
      );

    background-attachment: fixed;
  }

  header {
    padding: 40px 20px 20px 20px;
  }

  /* Main title */
  h1 {
    color: var(--gold-light);
    font-size: 1.45rem;
    margin: 0 0 10px 0;
    letter-spacing: 1px;
  }

  /* Fancy subheading */
  .subtitle {
    color: #d8c79f;
    font-family:
      "Palatino Linotype",
      "Book Antiqua",
      Palatino,
      Georgia,
      serif;
    font-size: 1.15rem;
    font-style: normal;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
  }

  .chain {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px 60px 15px;
  }

  .connector {
    width: 3px;
    height: 30px;
    background: linear-gradient(
      to bottom,
      var(--gold),
      var(--green-light)
    );
  }

  .card {
    width: 100%;
    max-width: 480px;
    border-radius: 14px;
    padding: 18px 20px;
    cursor: pointer;
    border: 1px solid var(--gold);
    transition: transform 0.15s ease;
  }

  .card:active {
    transform: scale(0.98);
  }

  .card-prophet {
    background: linear-gradient(
      145deg,
      #1a1405,
      #2b2108
    );

    border: 2px solid var(--gold);

    padding: 28px 20px;

    box-shadow:
      0 0 18px rgba(212,175,55,0.25);

    cursor: pointer;
  }

  .card-prophet .name {
    color: var(--gold-light);
    font-size: 1.4rem;
    font-weight: bold;
  }

  .card-shaykh {
    background: linear-gradient(
      145deg,
      var(--green),
      var(--green-light)
    );

    border: 1px solid #3a5c47;
  }

  .card-shaykh .name {
    color: var(--text);
    font-size: 1.05rem;
    line-height: 1.4;
  }

  .card-final {
    background: linear-gradient(
      145deg,
      #1a1405,
      #2b2108
    );

    border: 2px solid var(--gold);

    padding: 24px 20px;

    box-shadow:
      0 0 14px rgba(212,175,55,0.2);
  }

  .card-final .name {
    color: var(--gold-light);
    font-size: 1.15rem;
    font-weight: bold;
    line-height: 1.4;
  }

  /* ============================================================
     MODAL
  ============================================================ */

  .overlay {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.7);

    z-index: 100;

    justify-content: center;
    align-items: center;

    padding: 20px;
  }

  .overlay.active {
    display: flex;
  }

  .modal {
    background: #10190f;

    border: 1px solid var(--gold);

    border-radius: 14px;

    max-width: 500px;
    width: 100%;

    max-height: 85vh;

    overflow-y: auto;

    padding: 30px 24px;

    position: relative;

    text-align: left;
  }

  .close-btn {
    position: absolute;

    top: 14px;
    right: 16px;

    background: none;
    border: none;

    color: var(--gold-light);

    font-size: 1.6rem;

    cursor: pointer;

    line-height: 1;

    padding: 6px 10px;
  }

  .modal-number {
    color: var(--gold);

    font-size: 0.95rem;

    font-weight: bold;

    margin-bottom: 6px;
  }

  .modal-name {
    color: var(--gold-light);

    font-size: 1.3rem;

    font-weight: bold;

    margin-bottom: 20px;

    line-height: 1.4;
  }

  .modal-dates {
    font-size: 1rem;

    margin-bottom: 6px;

    color: var(--text);
  }

  .modal-heading {
    color: var(--gold);

    font-size: 1.1rem;

    margin-top: 20px;

    margin-bottom: 8px;

    border-top: 1px solid #2a3d31;

    padding-top: 16px;
  }

  .modal-bio {
    font-size: 1rem;

    line-height: 1.6;

    color: var(--text);
  }

  /* Biography paragraphs */
  .modal-bio p {
    margin: 0 0 16px 0;
  }

  .modal-bio p:last-child {
    margin-bottom: 0;
  }

</style>

</head>

  /* ============================================================
     PROPHET ﷺ INFORMATION
  ============================================================ */

  const prophet = {

    number: null,

    name:
      "Hadhrat Sarwar-e-Aalam Muhammad RasoolAllah ﷺ",

    born:
      "Monday 12th Rabi' al-Awwal 571 AD",

    passedAway:
      null,

    biography: `

The blessed birth of Allah’s Messenger ﷺ took place on Monday, 12th Rabi-ul-Awwal (according to some traditions, 9th Rabi-ul-Awwal), in 571 AD, the year of the Elephant. He was born in Makkah to Hadhrat Abdullah and Hadhrat Aminah, and his birth marked the arrival of the beloved Messenger of Allah Ta’ala and the leader of both worlds.

For the first few days, Allah’s Messenger ﷺ was fed by his blessed mother, after which he was nursed by Thuwaybah and then by Haleemah Sa’diyah RadhiAllahu Anha. It was the custom of the noble families of Quraysh to send their children to the countryside for a short period, and Haleemah Sa’diyah RadhiAllahu Anha was honoured with caring for the young Muhammad ﷺ. Her household was greatly blessed after his arrival.

At around two years of age, a remarkable incident took place when two angels came to Allah’s Messenger ﷺ, opened his blessed chest and washed his heart. At the age of six, his beloved mother passed away, and he was then cared for by his grandfather Abdul Muttalib. Two years later, his grandfather also passed away, and his uncle Abu Taalib took responsibility for him.

As Allah’s Messenger ﷺ grew older, his noble character became increasingly known. By the age of twenty-five, the people of Makkah called him Al-Ameen, meaning “the trustworthy”. Hadhrat Khadeejah-tul-Kubraa RadhiAllahu Anha heard of his honesty and employed him to take a caravan to Syria. After witnessing his exceptional character, she proposed marriage to him, and Allah’s Messenger ﷺ accepted.

At the age of forty, Allah’s Messenger ﷺ began experiencing true and beautiful dreams and would often spend time in the Cave of Hira. Then Hadhrat Jibreel Alayhis Salaam came with the first revelation and commanded him, “Read!” This marked the beginning of Wahi and his mission as the final Messenger of Allah Ta’ala.

Hadhrat Khadeejah RadhiAllahu Anha comforted Allah’s Messenger ﷺ when he returned home, reassuring him that Allah Ta’ala would never abandon a person of such noble character. In the early days, he ﷺ invited people to Islam privately. Hadhrat Khadeejah RadhiAllahu Anha was the first woman to accept Islam, while Hadhrat Abu Bakr Siddique RadhiAllahu Anhu was the first adult male. Hadhrat Ali RadhiAllahu Anhu was the first male child to accept Islam.

After three years, Allah Ta’ala commanded His Messenger ﷺ to openly invite people towards Islam. The Quraysh responded with increasing hostility, mocking and harming Allah’s Messenger ﷺ and persecuting the early Muslims. Despite the suffering, he ﷺ remained patient and continued calling people towards Islam.

As the persecution increased, some Muslims migrated to Abyssinia. Later, the Muslims were subjected to a three-year boycott. Ten years after the first revelation, Allah’s Messenger ﷺ suffered the loss of his beloved wife Hadhrat Khadeejah RadhiAllahu Anha and his uncle Abu Taalib. Due to the immense sadness caused by their deaths, that year became known as Aam-ul-Huzn, the Year of Sadness.

Allah’s Messenger ﷺ then travelled to Taif with Hadhrat Zayd bin Haarith RadhiAllahu Anhu to invite its people towards Islam. They rejected his message and treated him harshly, but he ﷺ continued to show patience.

Around this time came the miraculous journey of Mi’raaj. Allah’s Messenger ﷺ was taken from Makkah to Masjid Al-Aqsa on Buraaq, where he led the Prophets Alayhimus Salaam in Salaah. He was then taken through the heavens and granted an extraordinary station of nearness to Allah Ta’ala. During this journey, the five daily prayers were made obligatory upon the Ummah.

When the people of Makkah mocked Allah’s Messenger ﷺ after hearing about Mi’raaj, Hadhrat Abu Bakr Siddique RadhiAllahu Anhu immediately believed him without hesitation. From this, he became known as As-Siddique.

Allah’s Messenger ﷺ continued inviting the tribes of Arabia towards Islam, and eventually people from Yathrib, later known as Madeenah, accepted Islam and pledged to support him ﷺ. The Muslims were instructed to migrate, and eventually Allah’s Messenger ﷺ also made Hijrah with Hadhrat Abu Bakr Siddique RadhiAllahu Anhu.

The Quraysh had planned to kill Allah’s Messenger ﷺ, but Allah Ta’ala protected him. He ﷺ and Hadhrat Abu Bakr RadhiAllahu Anhu took refuge in the Cave of Thawr for three days. When Hadhrat Abu Bakr RadhiAllahu Anhu became concerned for their safety, Allah’s Messenger ﷺ reassured him: “Laa tahzan, innallaha ma’anaa” — “Do not fear; indeed Allah is with us.”

They eventually reached Madeenah, where Allah’s Messenger ﷺ was welcomed with immense happiness. He ﷺ stayed initially at Quba and then entered Madeenah, where Masjid-un-Nabawi was established and the Muslim community began to flourish.

In the second year after Hijrah, the Qiblah was changed towards the Ka’bah, fasting in Ramadhaan became obligatory, and permission for Jihad was given. The Muslims subsequently faced several major battles, including Badr, Uhud, Khandaq, Khaybar, the conquest of Makkah and Hunayn. Islam continued to spread throughout Arabia.

In the tenth year after Hijrah, Allah’s Messenger ﷺ performed his Farewell Hajj. During his Khutbahs, he emphasised the rights of Muslims, the protection of their lives and wealth, the rights of women, and holding firmly to the Book of Allah Ta’ala. On the Day of Arafah, Allah Ta’ala revealed that the Deen had been perfected and His favour upon the believers had been completed.

During his final illness, Allah’s Messenger ﷺ suffered from severe fever and weakness. When he was unable to lead the Salaah himself, he instructed Hadhrat Abu Bakr Siddique RadhiAllahu Anhu to lead the Muslims.

Eventually, on Monday, 12th Rabi-ul-Awwal, Allah’s Messenger ﷺ passed away from this world, with his blessed head resting in the lap of Hadhrat A’ishah Siddiqah RadhiAllahu Anha.

The passing of Allah’s Messenger ﷺ was the greatest loss suffered by the Ummah. His mission, however, had been completed, the Deen had been conveyed, and his Companions RadhiAllahu Anhum carried his message forward and spread Islam throughout the world.

Inna lillahi wa inna ilayhi raaji’oon.

`

  };

  const closeBtn =
    document.getElementById('closeBtn');


  /* ============================================================
     OPEN MODAL
  ============================================================ */

  function openModal(s) {

    /* Number */

    if (
      s.number === null ||
      s.number === undefined
    ) {

      modalNumber.textContent = '';

      modalNumber.style.display =
        'none';

    } else {

      modalNumber.textContent =
        'Shaykh #' + s.number;

      modalNumber.style.display =
        'block';
    }


    /* Name */

    modalName.textContent =
      s.name;


    /* ========================================================
       BIRTH LABEL

       First button:
       Blessed Birth:

       All Shaykhs:
       Born:
    ======================================================== */

    if (s.number === null) {

      if (s.born) {

        modalBorn.textContent =
          'Blessed Birth: ' + s.born;

        modalBorn.style.display =
          'block';

      } else {

        modalBorn.style.display =
          'none';

      }

    } else {

      if (s.born) {

        modalBorn.textContent =
          'Born: ' + s.born;

        modalBorn.style.display =
          'block';

      } else {

        modalBorn.style.display =
          'none';

      }

    }


    /* ========================================================
       PASSED AWAY / ALIVE

       Last button:
       Alhamdulillah Alive

       Others:
       Passed Away:
    ======================================================== */

    if (s.number === 38) {

      modalPassed.textContent =
        'Alhamdulillah Alive';

      modalPassed.style.display =
        'block';

    } else if (s.passedAway) {

      modalPassed.textContent =
        'Passed Away: ' +
        s.passedAway;

      modalPassed.style.display =
        'block';

    } else {

      modalPassed.textContent =
        '';

      modalPassed.style.display =
        'none';

    }


    /* ========================================================
       BIOGRAPHY

       Every blank line becomes a new paragraph.
    ======================================================== */

    modalBio.innerHTML =
      s.biography
        .trim()
        .split(/\n\s*\n/)
        .map(
          paragraph =>
            '<p>' +
            paragraph.trim() +
            '</p>'
        )
        .join('');


    overlay.classList.add('active');

  }


  /* ============================================================
     CLOSE MODAL
  ============================================================ */

  function closeModal() {

    overlay.classList.remove(
      'active'
    );

  }


  closeBtn.addEventListener(
    'click',
    closeModal
  );


  overlay.addEventListener(
    'click',
    (e) => {

      if (
        e.target === overlay
      ) {

        closeModal();

      }

    }
  );
